# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-java: # El trabajo se puede llamar de cualquier forma

    #runs-on: ubuntu-latest
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOs-latest]
    
    steps:
    - uses: actions/checkout@v2 # Este paso hace que GitHub Actions descargue/cloné tu repositorio dentro de la máquina virtual.

    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '8'
    - name: Verify Java installation
      shell: bash
      run: |
        echo "$JAVA_HOME"
        java -version
        ls -ld "$JAVA_HOME"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build and Push Docker Image
      if: runner.os == 'Linux' && github.event_name == 'push'
      uses: mr-smithers-excellent/docker-build-push@v4
      with:
        image: diegorojasfa/demo-app
        registry: docker.io
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}


